[project]
name = "aimemory"
version = "0.1.0"
description = "GNOME Wayland memory-pressure advisor with cached Gemini app facts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
aimemory = "aimemory.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimemory"]

[tool.uv]
package = true
